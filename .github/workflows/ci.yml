name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and test the web editor
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Package the plugin
        run: mvn -B -ntp package --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RexRanks
          path: |
            rexranks-plugin/target/RexRanks-*.jar
            !rexranks-plugin/target/original-*.jar
          if-no-files-found: error
          retention-days: 30
